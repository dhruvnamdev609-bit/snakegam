<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snake Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101820, #193b32);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.game-container {
    width: 100%;
    max-width: 450px;
    text-align: center;
    background: #172923;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 0 25px #00ff8840;
}

h1 {
    color: #00ff88;
    margin-bottom: 15px;
}

.score-board {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 18px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #0b1511;
    border: 3px solid #00ff88;
    border-radius: 10px;
}

#message {
    margin: 15px 0;
    min-height: 20px;
    color: #ffd166;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #00ff88;
    color: #10251b;
}

button:hover {
    background: #00cc6a;
}

.controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: repeat(3, 65px);
    justify-content: center;
    gap: 5px;
}

.controls button {
    margin: 0;
    padding: 12px 0;
    font-size: 22px;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

p {
    margin-top: 12px;
    font-size: 13px;
    color: #c9d7cf;
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        <span>Score: <b id="score">0</b></span>
        <span>Best: <b id="best">0</b></span>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div id="message">Press Start Game to play!</div>

    <button id="startBtn">Start Game</button>
    <button id="restartBtn">Restart 🔄</button>

    <div class="controls">
        <button class="up" data-dir="up">⬆️</button>
        <button class="left" data-dir="left">⬅️</button>
        <button class="down" data-dir="down">⬇️</button>
        <button class="right" data-dir="right">➡️</button>
    </div>

    <p>Use Arrow Keys or buttons to control the snake.</p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

const tile = 20;
const tiles = canvas.width / tile;

let snake;
let food;
let dx;
let dy;
let nextDx;
let nextDy;
let score = 0;
let best = 0;
let timer = null;
let running = false;
let gameOver = false;

try {
    best = Number(localStorage.getItem("snakeBest")) || 0;
} catch (e) {
    best = 0;
}

bestElement.textContent = best;

function resetGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    dx = 1;
    dy = 0;
    nextDx = 1;
    nextDy = 0;

    score = 0;
    running = false;
    gameOver = false;

    scoreElement.textContent = score;
    message.textContent = "Press Start Game to play!";
    startBtn.textContent = "Start Game";

    clearInterval(timer);
    timer = null;

    createFood();
    draw();
}

function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * tiles),
            y: Math.floor(Math.random() * tiles)
        };
    } while (
        snake.some(part => part.x === food.x && part.y === food.y)
    );
}

function draw() {
    ctx.fillStyle = "#0b1511";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw grid
    ctx.strokeStyle = "#14251c";
    ctx.lineWidth = 1;

    for (let i = 0; i <= canvas.width; i += tile) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }

    // Draw food
    ctx.fillStyle = "#ff4757";
    ctx.beginPath();
    ctx.arc(
        food.x * tile + tile / 2,
        food.y * tile + tile / 2,
        tile / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#00ff88" : "#00b86b";

        ctx.fillRect(
            part.x * tile + 1,
            part.y * tile + 1,
            tile - 2,
            tile - 2
        );

        if (index === 0) {
            ctx.fillStyle = "#10251b";

            const eye1x = part.x * tile + (dx === 0 ? 6 : dx === 1 ? 14 : 6);
            const eye1y = part.y * tile + (dy === 0 ? 6 : dy === 1 ? 14 : 6);

            ctx.beginPath();
            ctx.arc(eye1x, eye1y, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(
                eye1x + (dy === 0 ? 0 : 5),
                eye1y + (dx === 0 ? 0 : 5),
                2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    });
}

function startGame() {
    if (running) return;

    if (gameOver) {
        resetGame();
    }

    running = true;
    gameOver = false;
    message.textContent = "Eat the red food! 🍎";
    startBtn.textContent = "Playing...";

    clearInterval(timer);
    timer = setInterval(update, 120);
}

function update() {
    dx = nextDx;
    dy = nextDy;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    const ateFood = head.x === food.x && head.y === food.y;

    // Check wall collision
    if (
        head.x < 0 ||
        head.x >= tiles ||
        head.y < 0 ||
        head.y >= tiles
    ) {
        endGame();
        return;
    }

    // Check self collision
    const bodyToCheck = ateFood ? snake : snake.slice(0, -1);

    if (bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (ateFood) {
        score += 10;
        scoreElement.textContent = score;

        if (score > best) {
            best = score;
            bestElement.textContent = best;

            try {
                localStorage.setItem("snakeBest", best);
            } catch (e) {}
        }

        createFood();
    } else {
        snake.pop();
    }

    draw();
}

function endGame() {
    running = false;
    gameOver = true;

    clearInterval(timer);
    timer = null;

    message.textContent = "Game Over! Your score: " + score;
    startBtn.textContent = "Play Again";
}

function changeDirection(direction) {
    let newDx = dx;
    let newDy = dy;

    if (direction === "up") {
        newDx = 0;
        newDy = -1;
    } else if (direction === "down") {
        newDx = 0;
        newDy = 1;
    } else if (direction === "left") {
        newDx = -1;
        newDy = 0;
    } else if (direction === "right") {
        newDx = 1;
        newDy = 0;
    }

    // Prevent reversing directly into yourself
    if (newDx === -dx && newDy === -dy) return;

    nextDx = newDx;
    nextDy = newDy;
}

document.addEventListener("keydown", function(event) {
    const keys = [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        " "
    ];

    if (keys.includes(event.key)) {
        event.preventDefault();
    }

    if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
        changeDirection("up");
    } else if (
        event.key === "ArrowDown" ||
        event.key.toLowerCase() === "s"
    ) {
        changeDirection("down");
    } else if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        changeDirection("left");
    } else if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        changeDirection("right");
    }
});

document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("click", () => {
        changeDirection(button.dataset.dir);
    });
});

startBtn.addEventListener("click", startGame);

document.getElementById("restartBtn").addEventListener("click", resetGame);

// Initial screen
resetGame();
</script>

</body>
</html>
